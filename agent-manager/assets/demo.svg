<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="agent-manager demo">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #0f172a; stroke: #1f2a44; stroke-width: 1; }
      .title { fill: #cbd5e1; font: 600 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .text { fill: #e2e8f0; font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .muted { fill: #94a3b8; }
      .accent { fill: #22c55e; }
      .warn { fill: #f59e0b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="560" rx="16" />
  <rect class="panel" x="24" y="24" width="932" height="512" rx="12" />

  <!-- window chrome -->
  <circle cx="52" cy="52" r="6" fill="#ef4444" />
  <circle cx="72" cy="52" r="6" fill="#f59e0b" />
  <circle cx="92" cy="52" r="6" fill="#22c55e" />
  <text class="title" x="118" y="57">agent-manager · list / start / monitor / stop</text>

  <!-- terminal content -->
  <g class="text" transform="translate(48, 92)">
    <text x="0" y="0" class="muted">$ REPO_ROOT=/path/to/agent-manager-skill python3 agent-manager/scripts/main.py list</text>
    <text x="0" y="22">📋 Agents:</text>
    <text x="0" y="44"></text>
    <text x="0" y="66" class="warn">⭕ Stopped agent-emp-9999(demo)</text>
    <text x="0" y="88" class="muted">   Description: Demo agent for README screenshots</text>
    <text x="0" y="110" class="muted">   Working Dir: /path/to/agent-manager-skill</text>

    <text x="0" y="148" class="muted">$ python3 agent-manager/scripts/main.py start demo</text>
    <text x="0" y="170" class="accent">✅ Agent 'demo' started</text>
    <text x="0" y="192" class="muted">   Session: agent-emp-9999(demo)</text>
    <text x="0" y="214" class="muted">   Working Dir: /path/to/agent-manager-skill</text>

    <text x="0" y="252" class="muted">$ python3 agent-manager/scripts/main.py monitor demo -n 20</text>
    <text x="0" y="274">📺 Last 20 lines from agent-emp-9999(demo):</text>
    <text x="0" y="296" class="muted">agent-manager demo session</text>
    <text x="0" y="318">&gt;</text>

    <text x="0" y="356" class="muted">$ python3 agent-manager/scripts/main.py stop demo</text>
    <text x="0" y="378" class="accent">✅ Agent 'demo' stopped</text>
    <text x="0" y="400" class="muted">   Session agent-emp-9999(demo) terminated</text>

    <text x="0" y="444" class="muted">Tip: use <tspan class="text">schedule sync</tspan> to wire cron jobs to your installed skill path.</text>
  </g>
</svg>
