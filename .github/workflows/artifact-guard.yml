name: artifact-guard

on:
  push:
  pull_request:

jobs:
  backup-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject *.bak / *.orig / *~ files
        run: npm run check:artifacts
