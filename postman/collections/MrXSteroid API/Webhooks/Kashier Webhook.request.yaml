$kind: http-request
name: 'Kashier Webhook'
method: POST
url: '{{base_url}}/api/webhooks/kashier'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}",
      "status": "SUCCESS",
      "signature": "{{kashier_signature}}"
    }
